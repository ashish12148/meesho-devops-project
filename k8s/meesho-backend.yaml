apiVersion: apps/v1
kind: Deployment
metadata:
  name: meesho-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meesho-backend
  template:
    metadata:
      labels:
        app: meesho-backend
    spec:
      containers:
        - name: backend
          image: ashishpokale2207/meesho-backend:latest
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: meesho-backend
spec:
  selector:
    app: meesho-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP